<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Asmit 🎁</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#050510;color:#fff;font-family:Arial,sans-serif}
body:before,body:after{content:"";position:fixed;width:300px;height:300px;border-radius:50%;filter:blur(100px);opacity:.45}
body:before{background:#7c3aed;top:-100px;left:-100px}.after{background:#ec4899}
.card{position:relative;z-index:2;width:min(90%,500px);padding:40px 25px;text-align:center;border:1px solid #ffffff22;border-radius:28px;background:#ffffff0d;backdrop-filter:blur(15px);box-shadow:0 0 60px #7c3aed33;animation:in 1s ease}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
.gift{font-size:76px;animation:bounce 1.7s infinite}@keyframes bounce{50%{transform:translateY(-15px) rotate(5deg)}}
.small{margin-top:18px;letter-spacing:3px;color:#c4b5fd;font-size:12px}h1{font-size:clamp(42px,12vw,64px);margin:10px 0;background:linear-gradient(90deg,#fff,#c084fc,#f9a8d4);-webkit-background-clip:text;color:transparent}
p{line-height:1.6;color:#ddd;margin:15px 0 28px}button{border:0;border-radius:50px;padding:15px 30px;color:#fff;font-weight:bold;font-size:16px;background:linear-gradient(90deg,#7c3aed,#ec4899);box-shadow:0 0 25px #ec489977;cursor:pointer;transition:.3s}button:hover{transform:scale(1.07)}
.star{position:fixed;width:3px;height:3px;background:white;border-radius:50%;animation:twinkle 2s infinite alternate}@keyframes twinkle{to{opacity:.2;transform:scale(.6)}}
</style>
</head>
<body>
<div class="star" style="top:10%;left:15%"></div><div class="star" style="top:22%;left:82%"></div>
<div class="star" style="top:72%;left:10%"></div><div class="star" style="top:85%;left:75%"></div>
<div class="star" style="top:42%;left:92%"></div><div class="star" style="top:55%;left:25%"></div>
<main class="card">
<div class="gift">🎁</div>
<div class="small">A LITTLE SURPRISE FOR</div>
<h1>ASMIT</h1>
<p>Hey Asmit 👀<br>Someone has prepared something special for you...<br><br>But first, you have to open the surprise. 😏</p>
<button onclick="location.href='page2.html'">🎁 OPEN SURPRISE</button>
</main>
</body>
</html>
